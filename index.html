<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void Traveler | Uzay İletişim Ağı</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <!-- Google OAuth 2.0 Kütüphanesi -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root { --primary-color: #00f3ff; --bg-color: #050510; --card-bg: rgba(0, 24, 40, 0.7); --text-glow: 0 0 10px var(--primary-color); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Rajdhani', sans-serif; background-color: var(--bg-color); color: #fff; overflow-x: hidden; transition: background-color 0.5s ease; min-height: 100vh; }
        
        #space-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 3px 100%; z-index: -1; pointer-events: none; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }

        header { text-align: center; margin: 1rem 0 2rem; }
        header h1 { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; color: var(--primary-color); text-shadow: var(--text-glow); letter-spacing: 5px; text-transform: uppercase; }
        header p { font-size: 1.2rem; color: #aaa; margin-top: 0.5rem; letter-spacing: 3px; }

        .header-buttons { display: flex; justify-content: center; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .yt-button, .notify-btn, .auth-btn { padding: 0.8rem 2rem; font-family: 'Orbitron', sans-serif; font-size: 1rem; color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 2px; transition: all 0.3s ease; border-radius: 4px; cursor: pointer; }
        .yt-button { background: rgba(255, 0, 0, 0.1); border: 1px solid #ff0000; box-shadow: 0 0 10px rgba(255, 0, 0, 0.4); }
        .yt-button:hover { background: rgba(255, 0, 0, 0.8); box-shadow: 0 0 25px #ff0000; transform: translateY(-2px); }
        .notify-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--primary-color); color: var(--primary-color); box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .notify-btn:hover { background: var(--primary-color); color: var(--bg-color); box-shadow: 0 0 20px var(--primary-color); transform: translateY(-2px); }
        
        .auth-btn { background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; color: #ffd700; box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .auth-btn:hover { background: #ffd700; color: #000; box-shadow: 0 0 20px #ffd700; transform: translateY(-2px); }
        
        #user-profile { display: none; align-items: center; justify-content: center; gap: 15px; margin-top: 1.5rem; padding: 10px 20px; background: var(--card-bg); border: 1px solid var(--primary-color); border-radius: 8px; box-shadow: var(--text-glow); }
        #user-profile img { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--primary-color); }
        #user-profile .user-info-text { text-align: left; font-family: 'Orbitron', sans-serif; }
        #user-profile h4 { font-size: 1rem; color: #fff; }
        #user-profile p { font-size: 0.8rem; color: var(--primary-color); }

        .main-nav { display: flex; justify-content: center; gap: 3rem; margin-bottom: 3rem; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 1rem; }
        .main-nav button { background: none; border: none; color: #888; font-family: 'Orbitron', sans-serif; font-size: 1.5rem; cursor: pointer; text-transform: uppercase; letter-spacing: 3px; transition: all 0.3s ease; }
        .main-nav button:hover, .main-nav button.active { color: var(--primary-color); text-shadow: var(--text-glow); }

        .page-content { display: none; animation: fadeIn 0.4s ease forwards; }
        .page-content.active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .section-title { text-align: center; font-family: 'Orbitron', sans-serif; font-size: 2rem; color: #fff; margin-bottom: 2rem; letter-spacing: 4px; text-transform: uppercase; }
        .section-title span { color: var(--primary-color); }

        .category-nav { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
        .category-nav button { font-family: 'Orbitron', sans-serif; background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); padding: 0.8rem 1.5rem; font-size: 0.9rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; border-radius: 4px; }
        .category-nav button:hover, .category-nav button.active { background: var(--primary-color); color: var(--bg-color); box-shadow: 0 0 15px var(--primary-color); }

        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .video-card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; overflow: hidden; transition: transform 0.3s ease, border-color 0.5s ease; display: flex; flex-direction: column; justify-content: space-between; }
        .video-card:hover { transform: translateY(-5px); border-color: var(--primary-color); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .thumbnail-wrapper img { width: 100%; display: block; border-bottom: 2px solid var(--primary-color); }
        
        .video-info { padding: 1rem; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .video-info h3 { font-size: 1rem; margin-bottom: 0.8rem; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 2.6rem; }
        
        /* İzlenme & Beğeni Metrik Stili */
        .video-metrics { display: flex; justify-content: center; gap: 1rem; font-size: 0.85rem; color: #aaa; margin-bottom: 1rem; font-family: 'Orbitron', sans-serif; }
        .video-metrics span { display: flex; align-items: center; gap: 4px; }

        /* Kart Buton Grubu */
        .card-actions { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
        .watch-btn, .like-btn { padding: 0.5rem 1rem; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; text-decoration: none; transition: all 0.3s; }
        .watch-btn { background: var(--primary-color); color: var(--bg-color); }
        .watch-btn:hover { opacity: 0.85; }
        .like-btn { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--primary-color); color: #fff; }
        .like-btn:hover { background: var(--primary-color); color: #000; }
        .like-btn.liked { background: #39ff14; border-color: #39ff14; color: #000; cursor: default; }

        .loading, .error { grid-column: 1 / -1; text-align: center; font-size: 1.3rem; color: var(--primary-color); font-family: 'Orbitron', sans-serif; margin-top: 2rem; letter-spacing: 2px; }
        .mode-container { background: var(--card-bg); border: 1px solid var(--primary-color); border-radius: 8px; padding: 3rem; text-align: center; }

        #notification-toast { position: fixed; bottom: 20px; right: 20px; background: var(--card-bg); border: 1px solid var(--primary-color); color: #fff; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 0 20px var(--primary-color); font-family: 'Orbitron', sans-serif; display: none; z-index: 1000; }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>
    <div class="scanline"></div>
    <div id="notification-toast"></div>

    <div class="container">
        <header>
            <h1>Void Traveler</h1>
            <p>Galaktik Veri Arşivi</p>
            <div class="header-buttons">
                <a href="https://www.youtube.com/@void_traveler966" target="_blank" class="yt-button">Ana Gemiye Dön</a>
                <button onclick="requestNotificationPermission()" class="notify-btn" id="notify-btn">🔔 Bildirimleri Aç</button>
                <button onclick="handleAuthClick()" class="auth-btn" id="auth-btn">🛸 YouTube Bağlan</button>
            </div>
            <div id="user-profile"></div>
        </header>

        <nav class="main-nav">
            <button onclick="switchPage('page-records', this)" class="active">İletişim Kayıtları</button>
            <button onclick="switchPage('page-mode', this)">Oyun Modum</button>
        </nav>

        <div id="page-records" class="page-content active-page">
            <!-- Otomatik Oluşturulan Oynatma Listesi Butonları -->
            <div class="category-nav" id="category-nav">
                <div class="loading">Oynatma Listeleri Yükleniyor...</div>
            </div>

            <!-- Video Kartları Izgarası -->
            <div class="video-grid" id="video-grid"></div>
        </div>

        <div id="page-mode" class="page-content">
            <h2 class="section-title">Oyun <span>Modum</span></h2>
            <div class="mode-container">
                <p>Modüller aktif... Buraya oyun tarzın, sistem kuralların veya kişisel uzay günlüğün eklenecek.</p>
                <br>
                <p style="color: var(--primary-color); font-family: 'Orbitron', sans-serif;">(Sistem Hazır - Veri Bekleniyor)</p>
            </div>
        </div>
    </div>

    <script>
        // API VE OAUTH YAPILANDIRMASI
        const CLIENT_ID = '477152702497-2j98r43u0gbsiapndv4iisq6e9ldh5rv.apps.googleusercontent.com';
        const API_KEY = 'AIzaSyB3ZPLI9O-LvKB7LMqMgPdxqz8-79qLyMs';
        const CHANNEL_ID = 'UCLZ6rdlFePsR8_vqxY48XRw';
        const SCOPES = 'https://www.googleapis.com/auth/youtube.force-ssl'; // Yazma/Beğenme yetkisi

        let tokenClient;
        let accessToken = null;
        let currentPlaylistId = null;

        // Sayı Biçimlendirici (Örn: 14500 -> 14,5 B)
        const formatNumber = num => {
            if (!num) return '0';
            return new Intl.NumberFormat('tr-TR', { notation: 'compact', maximumFractionDigits: 1 }).format(num);
        };

        // 1. OAUTH VE PROFiL YÖNETİMİ
        function initOAuth() {
            if (typeof google !== 'undefined' && google.accounts) {
                tokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: CLIENT_ID,
                    scope: SCOPES,
                    callback: (tokenResponse) => {
                        if (tokenResponse && tokenResponse.access_token) {
                            accessToken = tokenResponse.access_token;
                            showToast("YouTube Bağlantısı Başarılı!");
                            fetchUserProfile();
                            if (currentPlaylistId) fetchPlaylistVideos(currentPlaylistId); // Beğen butonlarını aktif etmek için yenile
                        }
                    },
                });
            }
        }

        function handleAuthClick() {
            if (!tokenClient) initOAuth();
            if (tokenClient) {
                tokenClient.requestAccessToken();
            } else {
                showToast("OAuth kütüphanesi yükleniyor, lütfen tekrar deneyin.");
            }
        }

        function fetchUserProfile() {
            fetch('https://www.googleapis.com/youtube/v3/channels?mine=true&part=snippet,statistics', {
                headers: { 'Authorization': `Bearer ${accessToken}` }
            })
            .then(res => res.json())
            .then(data => {
                if (data.items && data.items.length > 0) {
                    const ch = data.items[0];
                    const profileDiv = document.getElementById('user-profile');
                    profileDiv.style.display = 'flex';
                    profileDiv.innerHTML = `
                        <img src="${ch.snippet.thumbnails.default.url}" alt="Profil">
                        <div class="user-info-text">
                            <h4>${ch.snippet.title}</h4>
                            <p>Abone: ${formatNumber(ch.statistics.subscriberCount)}</p>
                        </div>
                    `;
                    document.getElementById('auth-btn').innerText = "✓ Bağlandı";
                }
            })
            .catch(err => console.error("Profil çekme hatası:", err));
        }

        // 2. OTOMATİK OYNATMA LİSTELERİNİ ÇEKME & BUTON OLUŞTURMA
        async function fetchPlaylists() {
            const navContainer = document.getElementById('category-nav');
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/playlists?part=snippet&channelId=${CHANNEL_ID}&maxResults=50&key=${API_KEY}`);
                const data = await res.json();

                if (data.items && data.items.length > 0) {
                    navContainer.innerHTML = data.items.map((pl, index) => `
                        <button onclick="selectPlaylist('${pl.id}', this)" class="${index === 0 ? 'active' : ''}">
                            ${pl.snippet.title}
                        </button>
                    `).join('');

                    // İlk oynatma listesini otomatik yükle
                    selectPlaylist(data.items[0].id, navContainer.querySelector('button'));
                } else {
                    navContainer.innerHTML = '<div class="error">Oynatma listesi bulunamadı.</div>';
                }
            } catch (err) {
                console.error("Playlist çekme hatası:", err);
                navContainer.innerHTML = '<div class="error">Listeler yüklenemedi! API Key/Kanal ID kontrol edin.</div>';
            }
        }

        function selectPlaylist(playlistId, btn) {
            currentPlaylistId = playlistId;
            document.querySelectorAll('.category-nav button').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            fetchPlaylistVideos(playlistId);
        }

        // 3. VİDEOLARI VE İSTATİSTİKLERİ ÇEKME
        async function fetchPlaylistVideos(playlistId) {
            const gridContainer = document.getElementById('video-grid');
            gridContainer.innerHTML = '<div class="loading">Sinyal alınıyor...</div>';

            try {
                // A) Oynatma listesindeki videoları alma
                const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&playlistId=${playlistId}&maxResults=20&key=${API_KEY}`);
                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    gridContainer.innerHTML = '<div class="error">Bu listede video yok.</div>';
                    return;
                }

                // B) Videoların ID'lerini toplama ve detaylı istatistiklerini (izlenme/beğeni) çekme
                const videoIds = data.items.map(item => item.contentDetails.videoId);
                const statsMap = await fetchVideoStats(videoIds);

                // C) Kartları çizdirme
                gridContainer.innerHTML = data.items.map(item => {
                    const vId = item.contentDetails.videoId;
                    const stats = statsMap[vId] || { viewCount: 0, likeCount: 0 };
                    
                    return `
                        <div class="video-card">
                            <div class="thumbnail-wrapper">
                                <img src="https://img.youtube.com/vi/${vId}/hqdefault.jpg" alt="${item.snippet.title}">
                            </div>
                            <div class="video-info">
                                <h3>${item.snippet.title}</h3>
                                
                                <div class="video-metrics">
                                    <span>👁️ ${formatNumber(stats.viewCount)}</span>
                                    <span>👍 ${formatNumber(stats.likeCount)}</span>
                                </div>

                                <div class="card-actions">
                                    <a href="https://www.youtube.com/watch?v=${vId}" target="_blank" class="watch-btn">İZLE</a>
                                    ${accessToken ? `
                                        <button onclick="likeVideo('${vId}', this)" class="like-btn">👍 Beğen</button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Video çekme hatası:", err);
                gridContainer.innerHTML = '<div class="error">Sinyal hatası oluştu!</div>';
            }
        }

        async function fetchVideoStats(videoIds) {
            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=statistics&id=${videoIds.join(',')}&key=${API_KEY}`);
                const data = await res.json();
                return data.items.reduce((acc, item) => {
                    acc[item.id] = item.statistics;
                    return acc;
                }, {});
            } catch (err) {
                console.error("İstatistik hatası:", err);
                return {};
            }
        }

        // 4. SİTEDEN BEĞENİ ATMA (POST INSTEAD OF GET)
        async function likeVideo(videoId, btnElement) {
            if (!accessToken) {
                showToast("Lütfen önce YouTube hesabınızla giriş yapın!");
                return;
            }

            try {
                const res = await fetch(`https://www.googleapis.com/youtube/v3/videos/rate?id=${videoId}&rating=like`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (res.ok || res.status === 204) {
                    btnElement.classList.add('liked');
                    btnElement.innerHTML = '✓ Beğenildi';
                    btnElement.disabled = true;
                    showToast('Video YouTube hesabınızda beğenildi!');
                } else {
                    showToast('Beğeni işlemi başarısız oldu.');
                }
            } catch (err) {
                console.error('Beğeni hatası:', err);
                showToast('Hata oluştu.');
            }
        }

        // 5. YARDIMCI SİSTEM FONKSİYONLARI
        const switchPage = (pageId, btn) => {
            document.querySelectorAll('.page-content').forEach(p => p.classList.toggle('active-page', p.id === pageId));
            document.querySelectorAll('.main-nav button').forEach(b => b.classList.toggle('active', b === btn));
        };

        const showToast = msg => {
            const toast = document.getElementById('notification-toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 4000);
        };

        const updateNotificationButtonState = perm => {
            const btn = document.getElementById('notify-btn');
            if (!btn) return;
            const states = { granted: ['✓ Bildirimler Aktif', '#39ff14'], denied: ['✕ İzin Engellendi', '#ff0055'] };
            const [text, color] = states[perm] || ['🔔 Bildirimleri Aç', 'var(--primary-color)'];
            btn.innerText = text;
            btn.style.borderColor = btn.style.color = color;
        };

        const requestNotificationPermission = () => {
            if (!("Notification" in window)) return showToast("Tarayıcınız bildirim desteklemiyor.");
            Notification.requestPermission().then(p => {
                updateNotificationButtonState(p);
                showToast(p === "granted" ? "Sinyal İzni Alındı!" : "Bildirim reddedildi.");
            });
        };

        // Yıldız Arka Plan Animasyonu
        const canvas = document.getElementById('space-canvas'), ctx = canvas.getContext('2d');
        let stars = [];
        const resizeCanvas = () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = Array.from({ length: 150 }, () => ({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2, speed: Math.random() * 0.5 + 0.1 }));
        };
        const animateStars = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
            stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); ctx.fill(); s.y += s.speed; if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; } });
            requestAnimationFrame(animateStars);
        };

        // YÜKLEME
        window.onload = () => {
            initOAuth();
            if ("Notification" in window) updateNotificationButtonState(Notification.permission);
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas(); 
            animateStars(); 
            fetchPlaylists(); // Kanal playlistlerini ve videoları yükle
        };
    </script>
</body>
</html>
